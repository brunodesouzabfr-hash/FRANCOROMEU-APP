name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    name: Notify IndexNow from sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Submit canonical sitemap URLs
        env:
          INDEXNOW_KEY: 15371fdcae5446498483cb1385b2ccc3
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const host = 'www.francoromeufr.com.br';
          const key = process.env.INDEXNOW_KEY;
          const keyLocation = `https://${host}/${key}.txt`;
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const urlList = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);

          if (!urlList.length) {
            throw new Error('Nenhuma URL encontrada em sitemap.xml');
          }

          for (const url of urlList) {
            const parsed = new URL(url);
            if (parsed.hostname !== host || parsed.protocol !== 'https:') {
              throw new Error(`URL não canônica no sitemap: ${url}`);
            }
          }

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ host, key, keyLocation, urlList })
          });

          const responseText = await response.text();
          console.log(`IndexNow HTTP ${response.status}; URLs enviadas: ${urlList.length}`);
          if (responseText) console.log(responseText);

          if (!response.ok) process.exit(1);
          NODE
