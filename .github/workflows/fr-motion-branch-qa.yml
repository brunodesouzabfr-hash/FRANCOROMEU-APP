name: FR Motion Branch QA

on:
  push:
    branches:
      - feature/fr-motion-phase1-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          # Legacy regression compares pricing against an older pinned commit.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify phases 1-7 motion independently
        run: node --test tests/fr-nav-phase7.test.cjs tests/fr-iqe-avatar-phase6.test.cjs tests/fr-projects3d-phase5.test.cjs tests/fr-motion-phase4.test.cjs tests/fr-ambientes-363.test.cjs tests/fr-motion-phase1.test.cjs
      - name: Run all regression suites
        run: npm test
      - name: Check canonical HTML
        if: always()
        run: npm run check:html
      - name: Build production-formatted HTML in isolation
        if: always()
        run: npm run build
      - name: Audit public executed-work copy
        if: always()
        run: node --test tests/fr-executed-media-claims.test.cjs
      - name: Audit links and project library
        if: always()
        run: npm run check:project-library
      - name: Verify reproducible build
        if: always()
        run: npm run check:idempotence

  nav-chromium:
    name: Phase 7 Chromium geometry
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout feature branch without deployment
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned site dependencies
        run: npm ci --no-audit --no-fund
      - name: Build isolated public preview
        run: npm run build
      - name: Install pinned browser harness (not a production dependency)
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure centered dock, round corners, real scroll and budget route
        run: node tests/fr-nav-browser-phase7.cjs
      - name: Save desktop/mobile navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-phase7-navbar-chromium
          path: artifacts/nav-phase7/
          if-no-files-found: ignore
          retention-days: 7

  phase8-integrated:
    name: Phase 8 cross-route Chromium QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch, no deployment
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all canonical public routes
        run: npm run build
      - name: Install isolated browser harness
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium for real visual validation
        run: npx playwright install --with-deps chromium
      - name: Audit six routes, nav, menu, IQE, GA4, images and mobile
        run: node tests/fr-phase8-browser-audit.cjs
      - name: Save QA screenshots and evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-phase8-cross-route-qa
          path: artifacts/phase8/
          if-no-files-found: ignore
          retention-days: 14

  integration-preflight:
    name: Preserve main — non-destructive merge preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout entire branch history (isolated runner)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose conflicts with main without changing remote refs
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          printf 'Feature: '; git rev-parse HEAD
          printf 'Main: '; git rev-parse origin/main
          printf 'Merge base: '; git merge-base HEAD origin/main
          printf 'Main-only commits: '; git rev-list --count HEAD..origin/main
          printf 'Feature-only commits: '; git rev-list --count origin/main..HEAD
          git config user.name "FR Merge Preflight"
          git config user.email "fr-preflight@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit origin/main > /tmp/fr-merge-result.txt 2>&1
          merge_status=$?
          set -e
          cat /tmp/fr-merge-result.txt
          if [ "$merge_status" -ne 0 ]; then
            echo "::error::Merge conflict. The main branch remains untouched."
            echo "FILES_WITH_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "FILES_WITH_CONFLICTS_END"
            git ls-files -u | awk '{print $4}' | sort -u
            for file in $(git diff --name-only --diff-filter=U); do
              if [ -f "$file" ]; then
                echo "CONFLICT_MARKERS_FOR $file"
                grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$file" | head -40 || true
              fi
            done
            git merge --abort || true
            exit 1
          fi
          echo "CLEAN_MERGE_PREFLIGHT=PASS — no remote write"
          git merge --abort || true
