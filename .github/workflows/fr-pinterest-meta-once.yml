name: FR one-time Pinterest metadata update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fr-pinterest-meta-once.yml

permissions:
  contents: write

concurrency:
  group: fr-pinterest-meta-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply authorized metadata and governance update
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOne(path, oldValue, newValue) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(oldValue);
            if (first < 0 || source.indexOf(oldValue, first + oldValue.length) >= 0) throw new Error('Âncora ausente ou duplicada: ' + path);
            fs.writeFileSync(path, source.slice(0, first) + newValue + source.slice(first + oldValue.length));
          }
          const operations = [["index.html","<meta name=\"google-site-verification\" content=\"E_RRRPq5Hdni9bYjyrxFS2487bqKtuc9KijeiIeoLBg\" />","<meta name=\"google-site-verification\" content=\"E_RRRPq5Hdni9bYjyrxFS2487bqKtuc9KijeiIeoLBg\" />\n<meta name=\"p:domain_verify\" content=\"feefd2f4d4ca08f595a42c56885b37ad\">"],["index.html","    <meta name=\"author\" content=\"Franco Romeu — Arte & Engenharia\">\n    <link rel=\"canonical\"","    <meta name=\"author\" content=\"Franco Romeu — Arte & Engenharia\">\n    <meta name=\"application-name\" content=\"Franco Romeu\">\n    <meta name=\"apple-mobile-web-app-title\" content=\"Franco Romeu\">\n    <meta name=\"mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n    <meta name=\"referrer\" content=\"strict-origin-when-cross-origin\">\n    <link rel=\"canonical\""],["index.html","    <meta property=\"og:image\" content=\"https://francoromeu-app.vercel.app/assets/social/franco-romeu-og-site-1200x630.jpg\">\n    <meta property=\"og:image:alt\"","    <meta property=\"og:image\" content=\"https://francoromeu-app.vercel.app/assets/social/franco-romeu-og-site-1200x630.jpg\">\n    <meta property=\"og:image:secure_url\" content=\"https://francoromeu-app.vercel.app/assets/social/franco-romeu-og-site-1200x630.jpg\">\n    <meta property=\"og:image:type\" content=\"image/jpeg\">\n    <meta property=\"og:image:width\" content=\"1200\">\n    <meta property=\"og:image:height\" content=\"630\">\n    <meta property=\"og:image:alt\""],["AGENTS.md","- Não desenvolva diretamente na `main`.","- Use a `main` como origem canônica. Alterações diretas nela exigem autorização explícita do proprietário; sem essa autorização, use uma branch de tarefa."],["AGENTS.md","- Abra PR em rascunho até testes automáticos e aceite manual estarem documentados.","- Quando o trabalho usar PR, abra-o em rascunho até testes automáticos e aceite manual estarem documentados."],["AGENTS.md","- riscos, limitações e rollback estão descritos no PR;","- riscos, limitações e rollback estão descritos no PR ou no commit/diff quando houver alteração direta autorizada;"],["docs/fr-etapa16/README-COMECE-AQUI.md","A base registrada para este projeto é `codex/etapa-15-materialidade-imersiva`.","A base canônica registrada para este projeto é a branch `main`."],["docs/fr-etapa16/README-COMECE-AQUI.md","git switch codex/etapa-15-materialidade-imersiva\ngit pull --ff-only origin codex/etapa-15-materialidade-imersiva\ngit branch backup/etapa-15-antes-da-etapa-16","git switch main\ngit pull --ff-only origin main\ngit branch backup/main-antes-da-etapa-16"],["docs/fr-etapa16/MASTER-BRIEF.md","**Base canônica informada:** branch `codex/etapa-15-materialidade-imersiva`","**Base canônica informada:** branch `main`, correspondente à aplicação publicada em `https://francoromeu-app.vercel.app/`"],["prompts/CODEX-IMPLEMENTAR-ETAPA16.md","partindo da base canônica `codex/etapa-15-materialidade-imersiva`,","partindo da base canônica `main`, correspondente à aplicação publicada em `https://francoromeu-app.vercel.app/`,"],["tests/seo-brand-godmode.test.cjs","  const origin = 'https://francoromeu-app.vercel.app';\n","  const origin = 'https://francoromeu-app.vercel.app';\n  assert.equal(doc.querySelectorAll('meta[name=\"p:domain_verify\"]').length, 1);\n  assert.equal(doc.querySelector('meta[name=\"p:domain_verify\"]').content, 'feefd2f4d4ca08f595a42c56885b37ad');\n  assert.equal(doc.querySelector('meta[name=\"application-name\"]').content, 'Franco Romeu');\n  assert.equal(doc.querySelector('meta[name=\"apple-mobile-web-app-title\"]').content, 'Franco Romeu');\n  assert.equal(doc.querySelector('meta[name=\"mobile-web-app-capable\"]').content, 'yes');\n  assert.equal(doc.querySelector('meta[name=\"apple-mobile-web-app-capable\"]').content, 'yes');\n  assert.equal(doc.querySelector('meta[name=\"apple-mobile-web-app-status-bar-style\"]').content, 'black-translucent');\n  assert.equal(doc.querySelector('meta[name=\"referrer\"]').content, 'strict-origin-when-cross-origin');\n"],["tests/seo-brand-godmode.test.cjs","  assert.equal(doc.querySelector('meta[property=\"og:image\"]').content, `${origin}/assets/social/franco-romeu-og-site-1200x630.jpg`);\n","  assert.equal(doc.querySelector('meta[property=\"og:image\"]').content, `${origin}/assets/social/franco-romeu-og-site-1200x630.jpg`);\n  assert.equal(doc.querySelector('meta[property=\"og:image:secure_url\"]').content, `${origin}/assets/social/franco-romeu-og-site-1200x630.jpg`);\n  assert.equal(doc.querySelector('meta[property=\"og:image:type\"]').content, 'image/jpeg');\n  assert.equal(doc.querySelector('meta[property=\"og:image:width\"]').content, '1200');\n  assert.equal(doc.querySelector('meta[property=\"og:image:height\"]').content, '630');\n"]];
          for (const operation of operations) replaceOne(...operation);
          const agentsPath = 'AGENTS.md';
          let agents = fs.readFileSync(agentsPath, 'utf8');
          const sectionStart = agents.indexOf('## 0. Decisão canônica vigente');
          const sectionEnd = agents.indexOf('\n## 1. Missão do repositório', sectionStart);
          if (sectionStart < 0 || sectionEnd < 0) throw new Error('Seção canônica não localizada em AGENTS.md');
          agents = agents.slice(0, sectionStart) + "## 0. Decisão canônica vigente\n\n- A branch `main` é a única base funcional e visual canônica do projeto.\n- A `main` corresponde à aplicação publicada em `https://francoromeu-app.vercel.app/` e deve ser a origem de todo novo trabalho.\n- Branches de tarefa, quando usadas, devem partir da `main` atualizada e retornar a ela somente após validação.\n- Alterações diretas na `main` são permitidas quando o proprietário as autorizar explicitamente; sem essa autorização, use uma branch de tarefa.\n- O PR #6 e a branch `codex/etapa-15-materialidade-imersiva` permanecem apenas como histórico da evolução do produto e não são mais base de desenvolvimento.\n- PRs #3 e #4 e suas branches são histórico intermediário. Não continuar o visual dessas etapas separadamente.\n- O PR #5 e `codex/etapa-15-sites-individuais` foram rejeitados. Não reutilizar layout, navegação ou decisões visuais dessa tentativa.\n- A branch `develop` não tem papel aprovado no fluxo atual.\n- Fundamentos técnicos e visuais já consolidados na `main` devem ser preservados.\n- Não substitua a experiência atual por um novo redesign completo sem autorização explícita.\n- A decisão formal está em `docs/DECISAO_BASE_CANONICA_ETAPA15.md`.\n" + agents.slice(sectionEnd);
          fs.writeFileSync(agentsPath, agents);
          fs.writeFileSync('docs/DECISAO_BASE_CANONICA_ETAPA15.md', "# Decisão: `main` como base canônica da Franco Romeu\n\n**Data da decisão atual:** 22 de setembro de 2026\n**Decisão do proprietário:** a branch `main` atual é a única base funcional e visual canônica do projeto e corresponde à aplicação publicada em `https://francoromeu-app.vercel.app/`.\n\nEsta decisão substitui a orientação de 21 de agosto de 2026 que usava a branch `codex/etapa-15-materialidade-imersiva` como base provisória.\n\n## Estado de cada linha de trabalho\n\n| Item | Estado atual | Uso daqui em diante |\n|---|---|---|\n| `main` | Canônica e publicada | Fonte de verdade do produto. Todo novo trabalho deve partir da versão mais recente da `main`. |\n| Site Vercel | Produção | `https://francoromeu-app.vercel.app/` representa a aplicação canônica publicada. |\n| PR #6 / `codex/etapa-15-materialidade-imersiva` | Histórico | Não usar como base de desenvolvimento. Conservar apenas para rastreabilidade da evolução. |\n| PR #3 / Etapa 13.1.3 | Histórico intermediário | Não continuar separadamente. |\n| PR #4 / Etapa 14 | Histórico intermediário | Não continuar separadamente. |\n| PR #5 / “sites individuais” | Rejeitado | Não reutilizar layout, navegação nem decisões visuais. |\n| `develop` | Sem papel no fluxo atual | Não usar como base sem nova decisão explícita. |\n\n## Consequências práticas\n\n1. Antes de qualquer trabalho, atualizar e inspecionar a `main`.\n2. Branches de tarefa, quando necessárias, devem nascer da `main` atualizada.\n3. Alterações diretas na `main` são permitidas somente quando o proprietário as autorizar explicitamente.\n4. Sem autorização explícita para alteração direta, usar branch de tarefa e revisão antes de integrar.\n5. A aplicação publicada e a documentação de governança devem permanecer coerentes com a `main`.\n6. Branches e PRs antigos não voltam a ser canônicos por terem nomes de etapa; servem apenas como histórico.\n7. A experiência atual pode receber melhorias incrementais, mas não deve ser substituída por outro redesign completo sem nova decisão do proprietário.\n\n## Gate de qualidade\n\nToda alteração, direta ou via PR, deve preservar os contratos descritos em `AGENTS.md` e executar, no mínimo:\n\n```bash\nnpm test\nnpm run check:html\n```\n\nQuando aplicável, também devem ser registrados testes visuais, responsivos, de teclado, cálculo, persistência, PDF e integrações externas.\n\n## Registro desta atualização\n\nA atualização da governança e das metatags do site foi autorizada diretamente pelo proprietário em 22 de setembro de 2026. Ela não autoriza exclusão de branches, fechamento de PRs históricos ou redesign da aplicação.\n");
          const html = fs.readFileSync('index.html', 'utf8');
          if ((html.match(/name="p:domain_verify"/g) || []).length !== 1) throw new Error('Tag Pinterest ausente ou duplicada');
          if (!html.includes('property="og:image:width" content="1200"')) throw new Error('Dimensões Open Graph ausentes');
          NODE

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate repository
        run: |
          git diff --check
          npm test
          npm run check:html

      - name: Commit final files and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/DECISAO_BASE_CANONICA_ETAPA15.md docs/fr-etapa16/MASTER-BRIEF.md docs/fr-etapa16/README-COMECE-AQUI.md index.html prompts/CODEX-IMPLEMENTAR-ETAPA16.md tests/seo-brand-godmode.test.cjs
          git rm .github/workflows/fr-pinterest-meta-once.yml
          git diff --cached --check
          git commit -m "feat: adiciona verificação Pinterest e define main canônica"
          git push origin HEAD:main
